<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Succombe – Commander le plat du jour</title>
<meta name="description" content="Le plat du jour Succombe, avec ses valeurs nutritionnelles, livré chez vous.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#A8344E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><div class="brand">Succombe</div><div class="tag">Le plat du jour, livré chez vous.</div></div>
  </header>
  <main>
    <h2 id="dayTitle">La carte</h2>
    <div class="days" id="days" role="group" aria-label="Choisir le jour"></div>
    <div id="plats"><p class="muted">Chargement de la carte…</p></div>
    <section id="mineWrap"><h2>Mes commandes</h2><div id="mine"></div></section>
  </main>
</div>

<div class="cartbar" id="cartbar" aria-live="polite">
  <div class="cartbar-in">
    <div><div class="small muted" id="cartCount"></div><strong id="cartTotal"></strong></div>
    <button class="btn accent" id="openOrder" type="button">Commander</button>
  </div>
</div>

<dialog id="orderDlg">
  <form class="dlg" id="orderForm" novalidate>
    <h2>Votre commande</h2>
    <div class="recap" id="recap"></div>
    <div class="grid">
      <div><label for="f-prenom">Prénom *</label><input id="f-prenom" name="prenom" autocomplete="given-name" required></div>
      <div><label for="f-nom">Nom *</label><input id="f-nom" name="nom" autocomplete="family-name" required></div>
      <div><label for="f-tel">Téléphone *</label><input id="f-tel" name="tel" type="tel" autocomplete="tel" required></div>
      <div><label for="f-email">E-mail</label><input id="f-email" name="email" type="email" autocomplete="email"></div>
      <div class="full"><label for="f-adresse">Adresse de livraison *</label><input id="f-adresse" name="adresse" autocomplete="street-address" required></div>
      <div><label for="f-cp">Code postal *</label><input id="f-cp" name="cp" inputmode="numeric" autocomplete="postal-code" required></div>
      <div><label for="f-ville">Ville *</label><input id="f-ville" name="ville" autocomplete="address-level2" required></div>
      <div class="full"><label for="f-creneau">Créneau de livraison</label><select id="f-creneau" name="creneau"></select></div>
      <div class="full"><label for="f-note">Instructions (digicode, étage, allergies…)</label><textarea id="f-note" name="note"></textarea></div>
    </div>
    <div class="err" id="orderErr"></div>
    <div class="row">
      <button class="btn ghost" type="button" id="cancelOrder">Retour</button>
      <button class="btn accent" type="submit" id="sendOrder">Envoyer la commande</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="client.js"></script>
</body>
</html>
